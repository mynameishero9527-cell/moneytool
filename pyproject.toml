[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "moneytool"
version = "0.1.0"
description = "A股板块资金周期分析工具：单机本地运行，python -m moneytool 启动"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "akshare==1.18.97",
  "baostock>=0.8.9",
  "polars>=1.30",
  "duckdb>=1.3,<2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "apscheduler>=3.10,<4",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "filelock>=3.15",
  "pypinyin>=0.51",
  "structlog>=24.1",
  "typer>=0.12",
  "pandas>=2.0",
  "pyarrow>=16",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "types-PyYAML",
]

[project.scripts]
moneytool = "moneytool.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["moneytool"]
artifacts = ["moneytool/static/**", "moneytool/params/*.yaml", "moneytool/storage/migrations/*.sql", "moneytool/storage/queries/**/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "moneytool/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PL", "RUF"]
# E501：中文注释与 docstring 按显示宽度计为 2 列，代码宽度由 ruff format 保证，故不再单独检查。
ignore = ["E501", "PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003", "PLR0912", "PLR0915", "PLR0917", "PLR0911", "PLW0108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "PLC0415"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["moneytool"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["akshare", "akshare.*", "baostock", "baostock.*", "apscheduler.*", "pypinyin", "pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "acceptance: 需求 14 节验收标准",
  "golden: 历史交易日金样本",
  "network: 需要联网，默认跳过",
]
